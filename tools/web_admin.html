<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>喵喵机 · 设备管理</title>
<style>
  :root { --paper:#f8f3e6; --panel:#efe8d5; --ink:#1d2027; --muted:#938d7d; --line:#1d2027; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--paper); color:var(--ink); font-family:"Microsoft YaHei",system-ui,sans-serif; padding:22px; max-width:680px; margin:0 auto; }
  h1 { font-size:22px; margin-bottom:4px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:18px; }
  .card { background:var(--panel); border:2px solid var(--line); box-shadow:4px 4px 0 var(--line); padding:16px; margin-bottom:16px; }
  .card h2 { font-size:15px; margin-bottom:10px; }
  label { display:block; font-size:12px; color:var(--muted); margin:10px 0 4px; }
  input { width:100%; padding:9px 10px; border:2px solid var(--line); font-size:14px; background:#fff; }
  button { padding:9px 18px; border:2px solid var(--line); background:var(--ink); color:var(--paper); font-size:14px; cursor:pointer; margin-top:12px; }
  button:active { transform:translate(2px,2px); }
  button.ghost { background:transparent; color:var(--ink); }
  button.danger { background:#c62828; color:#fff; }
  .msg { margin-top:10px; font-size:13px; min-height:18px; }
  .ok { color:#2e7d32; } .err { color:#c62828; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:6px; }
  .stat { background:#fff; border:2px solid var(--line); padding:12px; text-align:center; }
  .stat b { display:block; font-size:26px; }
  .stat span { font-size:12px; color:var(--muted); }
  ol { font-size:13px; line-height:2; padding-left:20px; }
</style>
</head>
<body>
  <h1>喵喵机 · 设备管理</h1>
  <div class="sub">本页面由板子提供（同一 WiFi 下用浏览器访问即可）</div>

  <div class="card">
    <h2>学习数据</h2>
    <div class="grid">
      <div class="stat"><b id="s-learned">-</b><span>已学 / <span id="s-total">-</span></span></div>
      <div class="stat"><b id="s-due">-</b><span>今日到期</span></div>
      <div class="stat"><b id="s-od">-</b><span>已逾期</span></div>
      <div class="stat"><b id="s-mast">-</b><span>已掌握</span></div>
    </div>
    <button class="ghost" onclick="stats()">刷新</button>
    <button class="danger" onclick="reset()">清空学习进度</button>
    <div class="msg" id="msg2"></div>
  </div>

  <div class="card">
    <h2>MiMo 大模型配置（AI 挑战出题）</h2>
    <label>API Key（platform.xiaomimimo.com 获取）</label>
    <input id="key" placeholder="sk-...">
    <label>API Base URL</label>
    <input id="base" placeholder="https://api.xiaomimimo.com/v1">
    <label>模型名</label>
    <input id="model" placeholder="mimo-v2.5-pro">
    <label>TTS 音色（单词/例句发音）</label>
    <select id="voice" style="width:100%;padding:9px 10px;border:2px solid var(--line);font-size:14px;background:#fff;">
      <option value="冰糖">冰糖 · 女声甜萌</option>
      <option value="茉莉">茉莉 · 女声知性</option>
      <option value="苏打">苏打 · 男声少年</option>
      <option value="白桦">白桦 · 男声沉稳</option>
      <option value="Mia">Mia</option>
      <option value="Chloe">Chloe</option>
      <option value="Milo">Milo</option>
      <option value="Dean">Dean</option>
    </select>
    <button onclick="save()">保存到板子</button>
    <button class="ghost" onclick="test()">测试 AI 连接</button>
    <div class="msg" id="msg"></div>
  </div>

  <div class="card">
    <h2>AI 挑战使用方法</h2>
    <ol>
      <li>在本页填入 MiMo API Key 并保存</li>
      <li>板子「闯关 → AI 挑战」发起对局，AI 根据你已学的单词出题</li>
      <li>每题：AI 例句挖空 → 四选一 → 答题后 AI 给出中文讲解</li>
    </ol>
  </div>

<script>
function set(t, code, id) {
  var el = document.getElementById(id || 'msg');
  el.textContent = t; el.className = 'msg ' + (code ? 'err' : 'ok');
}
function load() {
  fetch('/api/config').then(r => r.json()).then(c => {
    /* 只在输入框为空时回显, 避免覆盖用户正在输入的内容 */
    if (!document.getElementById('key').value)
      document.getElementById('key').value = c.api_key || '';
    if (!document.getElementById('base').value)
      document.getElementById('base').value = c.base_url || '';
    if (!document.getElementById('model').value)
      document.getElementById('model').value = c.model || '';
    if (c.tts_voice) document.getElementById('voice').value = c.tts_voice;
  });
  stats();
}
function stats() {
  fetch('/api/stats').then(r => r.json()).then(s => {
    document.getElementById('s-total').textContent = s.total;
    document.getElementById('s-learned').textContent = s.learned;
    document.getElementById('s-due').textContent = s.due;
    document.getElementById('s-od').textContent = s.overdue;
    document.getElementById('s-mast').textContent = s.mastered;
  });
}
function save() {
  fetch('/api/config', { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ api_key:v('key'), base_url:v('base'), model:v('model'), tts_voice:v('voice') }) })
    .then(r => r.json()).then(j => set(j.code ? '保存失败' : '已保存到板子', j.code));
}
function test() {
  set('正在通过板子连接 MiMo（最长约 30 秒）...', 0);
  fetch('/api/test', { method:'POST' }).then(r => r.json())
    .then(j => set(j.msg || ('code=' + j.code), j.code));
}
function reset() {
  if (!confirm('确定清空全部学习进度？此操作不可恢复。')) return;
  fetch('/api/reset', { method:'POST' }).then(r => r.json())
    .then(j => { set(j.code ? '失败' : '已清空', j.code); stats(); });
}
function v(id){ return document.getElementById(id).value.trim(); }
load();
</script>
</body>
</html>
